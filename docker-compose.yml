services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: poth
      POSTGRES_PASSWORD: poth
      POSTGRES_DB: poth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poth"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://poth:poth@db:5432/poth
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

# A coleta de preço do G2G NÃO tem serviço aqui de propósito.
#
# Em produção o hub roda no Coolify, e o agendamento é uma Scheduled Task da
# própria aplicação chamando `POST /api/prices/g2g` (auth por CRON_SECRET) —
# ver scripts/g2g-price-collector/README.md. Um container só para isso seria
# ~500 MB parados para fazer duas chamadas HTTP a cada 30 min.
#
# Em dev, rode sob demanda:
#   npx tsx scripts/g2g-price-collector/index.ts --dry-run

volumes:
  pgdata:

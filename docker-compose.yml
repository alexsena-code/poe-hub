services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: poth
      POSTGRES_PASSWORD: poth
      POSTGRES_DB: poth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poth"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://poth:poth@db:5432/poth
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
      # Override the cron schedule at build time:
      #   docker compose build --build-arg CRON_SCHEDULE="0 * * * *" scraper
      args:
        CRON_SCHEDULE: "*/30 * * * *"
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://poth:poth@db:5432/poth
      NODE_ENV: production
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    # Mount a host volume to persist DiscordChatExporter exports between runs.
    # The DCE_PATH must point to the binary inside the container — mount it below
    # or set DCE_PATH in .env to a path that exists inside the container.
    volumes:
      - scraper_exports:/app/exports

volumes:
  pgdata:
  scraper_exports:

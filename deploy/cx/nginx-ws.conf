# ws.pathoftrade.net — reverse proxy WSS pro ws-server do CX (127.0.0.1:8766).
#
# Instalado por deploy/cx/setup-vps.sh em
#   /etc/nginx/sites-available/ws.pathoftrade.net (+ symlink em sites-enabled).
# TLS: rode `certbot --nginx -d ws.pathoftrade.net` DEPOIS de instalar este
# arquivo — o certbot injeta o listen 443/ssl e o redirect 80→443 sozinho.
#
# Decisão /metrics: NUNCA público. O Prometheus (docker compose da própria
# VPS) scrapa o ws-server direto em host.docker.internal:8766 com o token —
# não passa pelo Nginx. Humanos usam túnel SSH (ssh -L 8766:127.0.0.1:8766).
# Aqui o path devolve 403 sempre, mesmo com token.
#
# Paths WS servidos (o resto é 404):
#   /ws/executor  — cx_executor no PC do operador (auth por CX_WS_TOKEN)
#   /ws/dashboard — browser (front na Vercel) — sem auth por design
#   /ws/agent     — agents do monitor de bots

# Upgrade correto: conexões WS viram "Connection: upgrade", o resto fecha.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name ws.pathoftrade.net;

    # /metrics negado externamente — só via 8766 local (Prometheus/túnel).
    location = /metrics {
        return 403;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Conexões longas: heartbeat do executor/agent é 30s, stats do
        # dashboard a cada 5s — 300s de folga cobre qualquer silêncio.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        return 404;
    }
}

# ============================================================
# Observabilidade do módulo CX — Prometheus + Grafana
#
# Subir:  docker compose -f observability/docker-compose.observability.yml up -d
#
# As portas ficam presas em 127.0.0.1 de propósito. Na VPS (mahou-vps),
# acesse via SSH tunnel:
#   ssh -L 3001:127.0.0.1:3001 -L 9090:127.0.0.1:9090 mahou-vps
# ou publique atrás do Nginx do host (padrão da VPS) com auth própria.
#
# Antes de subir:
#   1. Edite observability/prometheus/prometheus.yml e troque o placeholder
#      do token pelo valor de CX_WS_TOKEN do ws-server.
#   2. (Postgres no Grafana) As envs CX_PG_* abaixo têm default igual ao
#      .env de dev do hub (poth:poth@localhost:5432/poth). Em prod, exporte
#      CX_PG_HOST/CX_PG_DB/CX_PG_USER/CX_PG_PASSWORD (ou crie um .env ao
#      lado deste compose) apontando pra um usuário READ-ONLY — ver
#      docs/observability/cx-metrics.md.
# ============================================================

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: cx-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    # host.docker.internal no Linux (na VPS) precisa do host-gateway;
    # no Docker Desktop (Windows/macOS) já existe e a entrada é inócua.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"

  grafana:
    image: grafana/grafana:11.6.0
    container_name: cx-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # TODO produção: trocar admin/admin (ver docs/observability/cx-metrics.md)
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Datasource Postgres (provisionado por env — defaults = .env de dev do hub)
      CX_PG_HOST: ${CX_PG_HOST:-host.docker.internal}
      CX_PG_PORT: ${CX_PG_PORT:-5432}
      CX_PG_DB: ${CX_PG_DB:-poth}
      CX_PG_USER: ${CX_PG_USER:-poth}
      CX_PG_PASSWORD: ${CX_PG_PASSWORD:-poth}
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
